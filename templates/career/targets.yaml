# Scan targets for /offer (via jobs-mcp). Board specs: greenhouse:<board-token>, lever:<company>, ashby:<org>, smartrecruiters:<company id> (the id in jobs.smartrecruiters.com/<id>).
# Find a company's board token in its careers-page URL: boards.greenhouse.io/<token>, jobs.lever.co/<company>, jobs.ashbyhq.com/<org>.

boards:
  - greenhouse:doordashcanada
  - ashby:cohere
  - lever:spotify

linkedin:
  - { keywords: "software engineer", location: "Toronto, Ontario, Canada" }
  - { keywords: "backend engineer", location: "Canada", remote_only: true }

# Sites with no public endpoint (signed-in only): /offer searches them in your own browser, read-only,
# one results page per entry. Paste the URL of a search you saved on the site. Remove what you don't use.
browser_sources:
  - { name: wellfound, url: "https://wellfound.com/jobs", max_results: 30 }

# Hiring signals (jobs-mcp `signals`): companies hiring before a role reaches a board — the HN
# "Who is hiring?" thread and startup funding news. /offer runs it weekly; see "Hiring signals" there.
signals:
  sources: [hn, funding]
  days: 30
  location_regex: "Toronto|Ontario|Canada|REMOTE \\((?:global|worldwide|anywhere|north america|americas)"
  include_regex: "python|typescript|backend|full[- ]?stack|agent|LLM|AI"
  exclude_regex: "crypto|web3"
  rounds: "pre-seed|seed|series a|series b"   # funding rounds worth a direct note; later rounds usually post on a board

filters:
  hours: 24
  include_regex: "engineer|developer"
  exclude_regex: "senior|staff|principal|lead|manager|director|intern|co-?op"
  location_regex: "Toronto|Ontario|Canada|Remote"
  max_years_required: 5
  salary_floor: "CAD 100,000"
  # Profile text for ranking (BM25, + embeddings with the jobs-mcp `rank` extra). Filters decide what is
  # eligible; this decides what comes first. Write it from facts.md: stack, domains, target role. No PII.
  rank_query: "backend engineer Python TypeScript distributed systems LLM agents"
